name: .NET 8 release package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version (for example 1.0.0)
        required: false
        default: "1.0.0"
        type: string

permissions:
  contents: read

concurrency:
  group: release-package-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration-tests:
    name: Unit and SQL Server integration tests
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQLSERVER_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/1433' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    env:
      HSCrmSqlServer: "Server=localhost,1433;Database=master;User Id=sa;Password=${{ secrets.CI_SQLSERVER_PASSWORD }};TrustServerCertificate=True;Encrypt=True"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore HSCrm.WebApi.sln
      - name: Run unit and SQL Server integration tests
        run: dotnet test HSCrm.UnitTests/HSCrm.UnitTests.csproj --configuration Release --no-restore --logger "trx;LogFileName=release-tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hscrm-backend-test-results-${{ github.run_id }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: integration-tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve release version
        id: release-version
        shell: pwsh
        run: |
          $version = "${{ inputs.release_version }}"
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "${{ github.ref_name }}" }
          if ($version -notmatch '^v?\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$') {
            throw "Release version must follow semantic version format (for example 1.0.0)."
          }
          "version=$version" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore HSCrm.WebApi.sln

      - name: Build
        run: dotnet build HSCrm.WebApi.sln --configuration Release --no-restore

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 8.0.21

      - name: Add global .NET tools to PATH
        shell: pwsh
        run: |
          Join-Path $env:USERPROFILE ".dotnet/tools" | Add-Content -Path $env:GITHUB_PATH

      - name: Generate idempotent database migration script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/publish/database" | Out-Null
          dotnet ef migrations script --idempotent --project HSCrm.DataModel/HSCrm.DataModel.csproj --startup-project HSCrm.WebApi/HSCrm.WebApi.csproj --output "$env:RUNNER_TEMP/publish/database/HSCrm-Database-Idempotent.sql"

      - name: Publish Backend for IIS
        run: dotnet publish HSCrm.WebApi/HSCrm.WebApi.csproj --configuration Release --no-restore --output "${{ runner.temp }}\publish\backend"

      - name: Include deployment metadata
        shell: pwsh
        run: |
          @(
            "component=backend"
            "targetFramework=net8.0"
            "version=${{ steps.release-version.outputs.version }}"
            "commit=${{ github.sha }}"
            "builtAtUtc=$([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content -Path "${{ runner.temp }}\publish\backend\release-info.txt" -Encoding utf8

      - name: Upload IIS package
        uses: actions/upload-artifact@v4
        with:
          name: hscrm-backend-${{ steps.release-version.outputs.version }}
          path: ${{ runner.temp }}\publish\backend\
          if-no-files-found: error
          retention-days: 30

      - name: Upload database migration script
        uses: actions/upload-artifact@v4
        with:
          name: hscrm-database-migrations-${{ steps.release-version.outputs.version }}
          path: "${{ runner.temp }}/publish/database/HSCrm-Database-Idempotent.sql"
          if-no-files-found: error
          retention-days: 30

